<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Master Pro - Suuri Ohjekirja</title>
    <style>
        :root { --green: #27ae60; --orange: #e67e22; --dark: #1a1a1a; --red: #c0392b; --blue: #2980b9; --purple: #8e44ad; --gold: #f1c40f; }
        
        body { font-family: 'Segoe UI', 'Trebuchet MS', sans-serif; background: var(--dark); color: white; text-align: center; margin: 0; padding-bottom: 120px; }
        .hidden { display: none !important; }
        .container { padding: 10px; max-width: 1000px; margin: auto; }
        
        /* Painikkeet */
        button { 
            background: var(--green); border: none; padding: 12px 18px; 
            color: white; border-radius: 8px; cursor: pointer; font-size: 14px; margin: 4px;
            font-weight: bold; transition: 0.2s; min-width: 140px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        button:hover { background: #2ecc71; }
        button.secondary { background: var(--orange); }
        button.blue { background: var(--blue); }
        button.purple { background: var(--purple); }
        button.gray { background: #7f8c8d; }
        button.exit-game { background: var(--red); margin-top: 20px; width: 100%; max-width: 300px; border: 2px solid white; }

        /* Sääntö-näkymä - Erittäin laaja */
        .rules-display { 
            background: #fff; color: #222; padding: 35px; border-radius: 25px; 
            border: 6px solid var(--gold); text-align: left; 
            margin: 20px 0; font-size: 18px; line-height: 1.8;
            max-height: 70vh; overflow-y: auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .rules-display h3 { color: var(--red); text-align: center; border-bottom: 3px solid #eee; padding-bottom: 15px; font-size: 26px; }
        .rules-display h4 { color: #000; margin: 30px 0 10px 0; font-size: 22px; border-left: 8px solid var(--green); padding-left: 15px; background: #f9f9f9; }
        .rules-display p { margin-bottom: 20px; }
        .rules-display b { color: var(--red); }
        .rules-display .highlight { background: #fff3cd; padding: 2px 5px; border-radius: 4px; border: 1px solid #ffeeba; }

        /* Tikkataulun koko - Tabletti-optimointi */
        #dartboard-container { position: relative; width: 320px; height: 320px; margin: 10px auto; transition: 0.3s; }
        @media (min-width: 600px) {
            #dartboard-container { width: 550px; height: 550px; }
            .container { padding: 30px; }
            h1 { font-size: 48px; }
        }

        #dartboard-svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
        .disabled-board { opacity: 0.1; pointer-events: none; }
        .segment { stroke: #333; stroke-width: 0.5; cursor: pointer; }
        .board-text { fill: white; font-size: 10px; font-weight: bold; pointer-events: none; }

        /* UI Elementit */
        #custom-confirm { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .confirm-box { background: #fff; color: #333; padding: 30px; border-radius: 20px; border: 4px solid var(--red); max-width: 350px; width: 85%; }
        #timer-box { background: var(--red); padding: 12px; border-radius: 12px; margin: 5px auto; max-width: 300px; border: 2px solid white; font-weight: bold; }
        #timer-bar-fill { width: 100%; height: 12px; background: var(--gold); transition: width 0.1s linear; border-radius: 6px; }

        #scoreboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(85px, 1fr)); gap: 8px; background: #000; padding: 15px; position: fixed; bottom: 0; width: 100%; border-top: 4px solid var(--green); max-height: 25vh; overflow-y: auto; z-index: 1000; }
        .player-box { background: #222; padding: 8px; border-radius: 8px; border: 1px solid #444; font-size: 11px; }
        .active-p { border-color: var(--gold); background: #2c3e50; box-shadow: 0 0 10px var(--gold); }
        .jail-p { border-color: var(--red); background: #300; color: #ff9999; }
        .done-p { opacity: 0.3; }

        #warfare-controls { margin: 20px auto; max-width: 400px; }
        .hit-btn { background: var(--red); font-size: 24px; padding: 30px; width: 100%; margin-bottom: 10px; border: 3px solid white; border-radius: 15px; }

        input, select { padding: 12px; font-size: 18px; border-radius: 8px; margin: 8px; width: 160px; border: 2px solid #ddd; }
        label { font-size: 16px; font-weight: bold; display: block; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- VARMISTUS-MODAL -->
    <div id="custom-confirm" class="hidden">
        <div class="confirm-box">
            <h3 style="color: var(--red);">⚠️ LOPETETAANKO?</h3>
            <p>Haluatko varmasti lopettaa nykyisen pelin ja palata etusivulle? Kaikki pisteet menetetään.</p>
            <button onclick="confirmYes()" class="secondary" style="width: 100%; margin-bottom: 10px; font-size: 16px;">KYLLÄ, LOPETA</button>
            <button onclick="confirmNo()" class="gray" style="width: 100%;">EI, JATKETAAN</button>
        </div>
    </div>

    <!-- ETUSIVU -->
    <div id="home-screen" class="container">
        <h1 style="color: var(--gold); text-shadow: 2px 2px 10px rgba(0,0,0,0.5);">🎯 DARTS MASTER PRO</h1>
        <p>Valitse peli ja aloita hauskanpito!</p>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;">
            <button onclick="openSettings('100')">Peli 100</button>
            <button onclick="openSettings('101')" class="secondary">Peli 101-901</button>
            <button onclick="openSettings('shanghai')" class="blue">Shanghai</button>
            <button onclick="openSettings('halveit')" class="blue">Halve It</button>
            <button onclick="openSettings('clock')" class="purple">Kellon ympäri</button>
            <button onclick="openSettings('killer')" class="purple">Killer</button>
            <button onclick="openSettings('scricket')" class="blue">Simple Cricket</button>
            <button onclick="openSettings('ccricket')" class="blue">Cut Throat</button>
            <button onclick="openSettings('golf')" class="purple" style="border: 2px solid gold;">Golf</button>
            <button onclick="openSettings('prisoner')" class="secondary">Vanginvartija</button>
            <button onclick="openSettings('fives')" class="secondary">Viitoset</button>
            <button onclick="openSettings('encricket')" class="blue">English Cricket</button>
            <button onclick="openSettings('warfare')" class="blue">Taistelu</button>
        </div>
    </div>

    <!-- ASETUKSET -->
    <div id="settings-screen" class="container hidden">
        <h2 id="stitle">Valmistelu</h2>
        <button onclick="showRules()" class="blue" style="width: 100%; max-width: 350px; margin: 10px 0; padding: 15px; font-size: 16px;">📖 LUE TARKAT SÄÄNNÖT</button>
        <div id="p-count-area">
            <label>Kuinka monta pelaajaa on mukana? (1-8)</label>
            <input type="number" id="p-count" value="2" min="1" max="8">
        </div>
        <div id="dynamic-settings"></div>
        <button onclick="startGame()" style="margin-top: 25px; font-size: 22px; padding: 20px 40px; background: var(--gold); color: #000;">ALOITA PELI ➔</button><br>
        <button onclick="showScreen('home-screen')" class="gray">TAKASIN ALKUUN</button>
    </div>

    <!-- SÄÄNNÖT -->
    <div id="rules-screen" class="container hidden">
        <h2 id="rules-game-title">Pelin säännöt</h2>
        <div class="rules-display" id="rules-text-content"></div>
        <button onclick="showScreen('settings-screen')" class="gray" style="font-size: 20px; padding: 15px 40px;">⬅ TAKASIN VALMISTELUUN</button>
    </div>

    <!-- PELINÄKYMÄ -->
    <div id="game-screen" class="container hidden">
        <div id="info-box" style="background:#2c3e50; padding:15px; border-radius:15px;">
            <h2 id="turn-txt" style="margin:0;">Pelaaja 1</h2>
            <div id="mode-hint" style="color:var(--gold); font-weight:bold; font-size: 18px; margin-top: 5px;">KOHDE</div>
            <div id="darts-display" style="font-size:32px; color:var(--gold); margin: 5px 0;">● ● ●</div>
            <div id="hit-txt" style="font-style: italic;">Heitä tikka...</div>
        </div>

        <div id="timer-box" class="hidden">
            ⏳ VAIHTO: <span id="timer-num">5</span>
            <div style="background: #555; height: 12px; border-radius: 6px; margin-top: 8px;"><div id="timer-bar-fill"></div></div>
        </div>
        
        <div id="dartboard-container">
            <svg id="dartboard-svg" viewBox="0 0 250 250">
                <circle cx="125" cy="125" r="120" fill="#111" />
                <g id="board-g"></g>
                <circle cx="125" cy="125" r="22" fill="#27ae60" class="segment" id="bull-outer" />
                <circle cx="125" cy="125" r="10" fill="#c0392b" class="segment" id="bull-inner" />
            </svg>
        </div>

        <div id="warfare-controls" class="hidden">
            <button class="hit-btn" onclick="handleWarfareAction(true)">OSUI LAIVAAN! 💥</button>
            <button class="miss-btn" onclick="handleWarfareAction(false)" style="background:#555; padding:15px; width:100%; border-radius: 10px;">OHI MENI 💨</button>
        </div>

        <button id="next-player-btn" onclick="nextPlayerManual()" class="secondary" style="width: 100%; max-width: 300px; padding: 15px;">VAIHDA PELAAJAA HETI</button><br>
        <button onclick="confirmExitToHome()" class="exit-game">🛑 LOPETA PELI</button>
    </div>

    <!-- LOPPUTULOKSET -->
    <div id="victory-screen" class="hidden">
        <h1 style="font-size: 40px; color: var(--gold);">🏆 ONNEA!</h1>
        <div id="results-list" style="font-size:22px; margin:20px; background: #333; padding: 25px; border-radius: 15px;"></div>
        <button onclick="startGame()" class="secondary" style="font-size: 20px; padding: 15px 30px;">PELAA UUDELLEEN</button><br>
        <button onclick="showScreen('home-screen')" class="gray">PALAA PÄÄVALIKKOON</button>
    </div>

    <div id="scoreboard" class="hidden"></div>

    <script>
        let players = [], curIdx = 0, goal = 100, mode = '100';
        let dartsLeftToThrow = 3, winners = 0, autoTimer = null;
        let currentRound = 1;
        const boardValues = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];

        const gameData = {
            '100': { 
                title: "Peli 100", 
                rules: `<h3>Peli 100 - Pisteiden kerääminen</h3>
                        <h4>Tavoite:</h4><p>Kerää mahdollisimman paljon pisteitä mahdollisimman nopeasti. Pelin alussa valitaan tavoite, esimerkiksi 100 tai 300 pistettä.</p>
                        <h4>Pelin kulku:</h4><p>Jokainen pelaaja heittää vuorollaan 3 tikkaa. Kaikki osumat lasketaan yhteen. Esimerkiksi, jos osut numeroihin 20, 5 ja 1, saat yhteensä 26 pistettä sille vuorolle.</p>
                        <h4>Miten taulu toimii?</h4><p>Uloin kapea rengas antaa pisteet kaksinkertaisena (tupla) ja keskimmäinen kapea rengas kolminkertaisena (tripla).</p>
                        <h4>Miten peli päättyy?</h4><p>Peli päättyy, kun joku saavuttaa sovitun pisterajan. Tässä pelissä ei haittaa, vaikka heittäisit yli tavoitteen – olet silti maalissa!</p>`,
                settings: `<label>Mikä on pisteraja, johon asti pelataan?</label><input type="number" id="goal-score" value="100" step="50">` 
            },
            '101': { 
                title: "Peli 101-901", 
                rules: `<h3>Peli 101-901 - Vähennyspeli</h3>
                        <h4>Tavoite:</h4><p>Tässä pelissä ei kerätä pisteitä nollasta ylöspäin, vaan aloitetaan suuresta luvusta (kuten 301) ja yritetään vähentää se tasan nollaan.</p>
                        <h4>Pelin kulku:</h4><p>Jokaisen heittämäsi tikan pisteet vähennetään kokonaissummastasi. Tavoitteena on päästä nollaan.</p>
                        <h4>Tärkeä sääntö (Bust eli yliheitto):</h4><p>Jos sinulla on jäljellä 10 pistettä, mutta heitätkin 11, pisteesi eivät muutu miksikään ja vuorosi loppuu heti. Tätä kutsutaan 'Bustiksi'. Sinun on päästävä <b>tasan nollaan</b> voittaaksesi.</p>
                        <p>Mummin vinkki: Kun pisteet alkavat olla pienet, heitä varovasti!</p>`,
                settings: `<label>Mistä luvusta aloitetaan vähentäminen?</label><input type="number" id="goal-score" value="301" step="100">` 
            },
            'shanghai': { 
                title: "Shanghai", 
                rules: `<h3>Shanghai - Kierrospeli</h3>
                        <h4>Mistä on kyse?</h4><p>Peli kestää 7 kierrosta. Jokaisella kierroksella on vain yksi oikea numero, johon yritetään osua.</p>
                        <h4>Pelin kulku:</h4>
                        <ul>
                            <li><b>Kierros 1:</b> Kaikki heittävät vain numeroon 1.</li>
                            <li><b>Kierros 2:</b> Kaikki heittävät vain numeroon 2... ja niin edelleen aina numeroon 7 asti.</li>
                        </ul>
                        <p>Osumat muihin numeroihin antavat 0 pistettä.</p>
                        <h4>Miten voitetaan?</h4><p>Pelaaja, jolla on eniten pisteitä 7 kierroksen jälkeen, voittaa. Tai voit tehdä 'Shanghain'!</p>
                        <h4>Erikoisvoitto (Shanghai!):</h4><p>Voit voittaa pelin heti, jos osut saman vuoron aikana kierroksen numeroon näin: yhteen tavalliseen ruutuun, yhteen tuplaan ja yhteen triplaan.</p>`,
                settings: "" 
            },
            'halveit': { 
                title: "Halve It", 
                rules: `<h3>Halve It - Jännitysnäytelmä</h3>
                        <h4>Tavoite:</h4><p>Kerää pisteitä, mutta varo niiden puolittumista!</p>
                        <h4>Pelin kulku:</h4><p>Sovellus antaa joka kierrokselle tietyn kohteen (esimerkiksi numero 20, sitten 19, sitten joku tupla jne.).</p>
                        <h4>Puolittumissääntö:</h4><p>Jos osut kohteeseen, saat pisteitä. Mutta jos <b>kaikki 3 tikkaa</b> menevät ohi kyseisestä kohteesta, nykyiset kokonaispisteesi <b>puolitetaan</b> välittömästi.</p>
                        <p>Peli vaatii kylmiä hermoja. Yritä osua edes kerran varmistaaksesi pisteet!</p>`,
                settings: "" 
            },
            'clock': { 
                title: "Kellon ympäri", 
                rules: `<h3>Kellon ympäri - Numerokierto</h3>
                        <h4>Tavoite:</h4><p>Kierrä numerot 1, 2, 3... aina tavoitteeseen (esim. 20) asti järjestyksessä mahdollisimman nopeasti.</p>
                        <h4>Pelin säännöt:</h4><p>Sinun on osuttava numeroon 1 ennen kuin voit yrittää numeroa 2. Jos osut numeron 2 ohi vaikka seiskaan, se ei haittaa, mutta et saa kakkosta merkittyä.</p>
                        <p>Vasta kun kumpikin on suorittanut nykyisen kohdenumeron, siirrytään eteenpäin. Voittaja on se, joka saavuttaa tavoitteen ensimmäisenä.</p>`,
                settings: `<label>Mihin numeroon asti kierretään?</label><select id="clock-goal"><option value="5">1-5</option><option value="10">1-10</option><option value="15">1-15</option><option value="20" selected>1-20</option></select>` 
            },
            'killer': { 
                title: "Killer", 
                rules: `<h3>Killer - Pudotuspeli</h3>
                        <h4>Tavoite:</h4><p>Ole viimeinen pelaaja, jolla on elämiä jäljellä.</p>
                        <h4>Vaihe 1: Killeriksi tuleminen</h4><p>Jokaiselle on arvottu oma numero. Heitä omaa numeroasi niin kauan, että saat 3 osumaa (tupla antaa 2 osumaa). Kun olet saanut 3 osumaa, olet <b>Killer</b>.</p>
                        <h4>Vaihe 2: Jahtaus</h4><p>Nyt voit alkaa heittää vastustajien numeroita. Jokainen osuma vie heiltä yhden elämän. Kun elämät loppuvat, pelaaja putoaa pelistä.</p>
                        <h4>Varoitus:</h4><p>Jos Killer osuu vahingossa omaan numeroonsa, hän menettää itse elämän!</p>`,
                settings: `<label>Kuinka monta elämää jokaisella on?</label><input type="number" id="killer-lives" value="3" min="1">` 
            },
            'scricket': { 
                title: "Simple Cricket", 
                rules: `<h3>Simple Cricket - Numeroiden sulku</h3>
                        <h4>Tavoite:</h4><p>Sulje kaikki numerot väliltä 15-20 sekä häränsilmä (keskusta).</p>
                        <h4>Miten numero suljetaan?</h4><p>Sinun on osuttava kuhunkin numeroon yhteensä 3 kertaa. Tupla on 2 osumaa ja tripla on 3 osumaa (eli sulkee numeron kerralla).</p>
                        <h4>Pelin päättyminen:</h4><p>Tässä pelissä ei lasketa pisteitä. Se, joka saa ensimmäisenä kaikki vaaditut numerot suljettua (3 merkkiä per numero), voittaa pelin.</p>`,
                settings: "" 
            },
            'ccricket': { 
                title: "Cut Throat Cricket", 
                rules: `<h3>Cut Throat Cricket - Taktinen peli</h3>
                        <h4>Mistä on kyse?</h4><p>Tämä on kuin tavallinen Cricket, mutta pisteillä on merkitystä. Tässä pelissä <b>vähiten pisteitä saanut voittaa</b>.</p>
                        <h4>Pisteytys:</h4><p>Jos olet jo sulkenut numeron (3 osumaa) ja osut siihen uudestaan, pisteet menevät vastustajillesi – paitsi jos hekin ovat jo sulkeneet kyseisen numeron.</p>
                        <p>Tavoitteena on siis sulkea omat numerot nopeasti ja sen jälkeen "rankaista" kavereita syöttämällä heille lisää pisteitä!</p>`,
                settings: "" 
            },
            'golf': { 
                title: "Golf", 
                rules: `<h3>Golf - Tarkkuuspeli</h3>
                        <h4>Tärkeä sääntö:</h4><p>Tässä pelissä heitetään vain <b>yksi tikka per reikä</b> (kierros). Sen tulos jää heti voimaan.</p>
                        <h4>Pelin kulku:</h4><p>Numero 1 on reikä 1, numero 2 on kakkosreikä jne. Pelataan joko 9 tai 18 reikää.</p>
                        <h4>Pisteytys (pienin summa voittaa):</h4>
                        <ul>
                            <li>Tripla (sisempi kapea rengas): 1 lyönti.</li>
                            <li>Tupla (uloin kapea rengas): 2 lyöntiä.</li>
                            <li>Kapea single: 3 lyöntiä.</li>
                            <li>Leveä single: 4 lyöntiä.</li>
                            <li>Ohi: 5 lyöntiä.</li>
                        </ul>
                        <p>Tasapelin sattuessa peli jatkuu lisäväylillä, kunnes voittaja selviää!</p>`,
                settings: `<label>Pelataanko 9 vai 18 reikää?</label><select id="golf-holes"><option value="9" selected>9 reikää</option><option value="18">18 reikää</option></select>` 
            },
            'prisoner': { 
                title: "Vanginvartija", 
                rules: `<h3>Vanginvartija - Tikat vankilassa</h3>
                        <h4>Tavoite:</h4><p>Kierrä numerot 1-20 (tai valittu tavoite) järjestyksessä. Tässä pelissä tikat voivat loppua kesken!</p>
                        <h4>Vankila-sääntö:</h4><p>Jos heität tikan ohi kohdenumeron, se jää tauluun "vangiksi". Et voi käyttää sitä tikkaa enää seuraavilla vuoroilla, ellet saa sitä takaisin.</p>
                        <h4>Miten vapautat tikat?</h4>
                        <ul>
                            <li><b>Osumalla kohdenumeroon:</b> saat kaikki omat vankitikkasi takaisin.</li>
                            <li><b>Osumalla häränsilmään (Bull):</b> vapautat kaikkien pelaajien kaikki tikat kerralla!</li>
                        </ul>
                        <p>Jos kaikki tikkasi ovat vankilassa, joudut odottamaan, että joku muu vapauttaa ne osumalla keskelle.</p>`, 
                settings: `<label>Mihin numeroon asti kierretään?</label><select id="prisoner-goal"><option value="5">1-5</option><option value="10">1-10</option><option value="15">1-15</option><option value="20" selected>1-20</option></select>` 
            },
            'fives': { 
                title: "Viitoset", 
                rules: `<h3>Viitoset - Matematiikkapeli</h3>
                        <h4>Mistä on kyse?</h4><p>Tavoitteena on heittää kolmella tikalla sellainen yhteissumma, joka on jaollinen viidellä (esim. 15, 20, 25, 30...).</p>
                        <h4>Miten pisteet lasketaan?</h4><p>Jos vuoron summa on jaollinen 5:llä, saat pisteitä summan jaettuna viidellä.</p>
                        <p>Esimerkki: Heität 20 + 5 + 5 = 30. Saat 6 pistettä saldoon (koska 30 / 5 = 6).</p>
                        <p>Jos summa on vaikkapa 26, et saa pisteitä. Ensimmäinen tavoitteeseen päässyt voittaa.</p>`,
                settings: `<label>Mikä on pisteraja voittoon?</label><input type="number" id="goal-score" value="50" step="10">` 
            },
            'encricket': { 
                title: "English Cricket", 
                rules: `<h3>English Cricket - Lyöjä vs Keilaaja</h3>
                        <h4>Roolit:</h4><p>Pelataan kahdella pelaajalla. Toinen on Batter (Lyöjä) ja toinen Bowler (Keilaaja).</p>
                        <h4>Bowlerin tehtävä:</h4><p>Yrittää osua häränsilmään (Bull). Jokainen osuma poistaa Batterilta yhden "hilan" (Wickets). Kun 10 hilaa on mennyt, osat vaihtuvat.</p>
                        <h4>Batterin tehtävä:</h4><p>Kerää pisteitä muista numeroista. Vain vuoron 40 pistettä ylittävät osumat lasketaan (esim. 65p vuoro tuo 25p peliin).</p>
                        <p>Kun kummatkin ovat olleet Battereina, eniten pisteitä kerännyt voittaa.</p>`,
                settings: "" 
            },
            'warfare': { 
                title: "Taistelu", 
                rules: `<h3>Taistelu - Sosiaalinen laivanupotus</h3>
                        <h4>Valmistelu:</h4><p>Kumpikin pelaaja valitsee salaa vastustajan puolelta taulua 3 numeroa, jotka ovat hänen "laivojaan". Älä kerro niitä muille!</p>
                        <h4>Pelin kulku:</h4><p>Heitä vastustajan puolelle taulua. Jos osut vastustajan laivaan, vastustajan on rehellisesti sanottava "OSUI!" ja painetaan sovelluksen punaista nappia.</p>
                        <h4>Voittaminen:</h4><p>Kun olet saanut 3 osumaa vastustajan laivoihin, olet voittanut taistelun!</p>`,
                settings: "" 
            }
        };

        function showScreen(id) {
            clearInterval(autoTimer); autoTimer = null;
            document.querySelectorAll('.container, #scoreboard, #victory-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'game-screen') document.getElementById('scoreboard').classList.remove('hidden');
        }

        function confirmExitToHome() { document.getElementById('custom-confirm').classList.remove('hidden'); }
        function confirmYes() { document.getElementById('custom-confirm').classList.add('hidden'); showScreen('home-screen'); }
        function confirmNo() { document.getElementById('custom-confirm').classList.add('hidden'); }

        function openSettings(m) {
            mode = m; const data = gameData[m];
            showScreen('settings-screen');
            document.getElementById('stitle').innerText = data.title;
            document.getElementById('dynamic-settings').innerHTML = data.settings;
            document.getElementById('p-count-area').classList.toggle('hidden', ['encricket','warfare'].includes(m));
        }

        function showRules() {
            const data = gameData[mode];
            document.getElementById('rules-game-title').innerText = data.title;
            document.getElementById('rules-text-content').innerHTML = data.rules;
            showScreen('rules-screen');
        }

        function startGame() {
            let count = parseInt(document.getElementById('p-count').value);
            if(['encricket','warfare'].includes(mode)) count = 2;
            players = []; winners = 0; curIdx = 0; currentRound = 1;

            if(mode === 'golf') goal = parseInt(document.getElementById('golf-holes').value);
            else if(mode === 'clock') goal = parseInt(document.getElementById('clock-goal').value);
            else if(mode === 'prisoner') goal = parseInt(document.getElementById('prisoner-goal').value);
            else if(document.getElementById('goal-score')) goal = parseInt(document.getElementById('goal-score').value);

            for(let i=1; i<=count; i++) {
                players.push({ id: i, score: 0, done: false, rank: 0, clock: 1, dartsInJail: 0, dartsAvailable: 3, marks: 0, cricket: { 20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 25:0 } });
                if(mode === '101') players[i-1].score = goal;
                if(mode === 'encricket') players[i-1].role = (i === 1) ? 'batter' : 'bowler';
            }
            showScreen('game-screen');
            document.getElementById('dartboard-container').classList.toggle('hidden', mode === 'warfare');
            document.getElementById('warfare-controls').classList.toggle('hidden', mode !== 'warfare');
            initTurn();
        }

        function handleHit(pts, m, type) {
            if (autoTimer || players[curIdx].done) return;
            const p = players[curIdx]; const hitVal = pts * m; let isWin = false;

            if (mode === 'golf') {
                let tNum = ((currentRound - 1) % 20) + 1;
                let s = 5; if(pts === tNum) { if(type==='triple') s = 1; else if(type==='double') s = 2; else if(type==='single-inner') s = 3; else s = 4; }
                p.score += s; dartsLeftToThrow = 0; startTimer(); updateUI(); return;
            }

            if (mode === 'prisoner') {
                dartsLeftToThrow--;
                if (pts === p.clock) { p.clock++; p.dartsAvailable += p.dartsInJail; p.dartsInJail = 0; if (p.clock > goal) isWin = true; } 
                else if (pts === 25) { players.forEach(pl => { pl.dartsAvailable += pl.dartsInJail; pl.dartsInJail = 0; }); } 
                else { p.dartsAvailable--; p.dartsInJail++; }
                if (isWin) { markWinner(p); return; }
                if (dartsLeftToThrow <= 0 || p.dartsAvailable <= 0) finishTurn(p);
            } else {
                dartsLeftToThrow--;
                switch(mode) {
                    case '100': p.score += hitVal; if(p.score >= goal) isWin = true; break;
                    case '101': if(p.score - hitVal >= 0) { p.score -= hitVal; if(p.score === 0) isWin = true; } else { dartsLeftToThrow = 0; } break;
                    case 'shanghai': if(pts === currentRound) { p.shH = p.shH || new Set(); p.shH.add(m); p.score += hitVal; if(p.shH.size === 3) isWin = true; } break;
                    case 'clock': if(pts === p.clock) { p.clock++; if(p.clock > goal) isWin = true; } break;
                    case 'halveit': const hT = [20,19,'D',18,17,'T',16,15,25]; if((hT[currentRound-1]==='D'&&type==='double')||(hT[currentRound-1]==='T'&&type==='triple')||pts===hT[currentRound-1]) { p.score += hitVal; p.hitT = true; } break;
                    case 'killer': if(!p.killer) { if(pts === boardValues[p.id-1]) { p.marks += m; if(p.marks >= 3) p.killer = true; } } else { players.forEach(o => { if(o.id!==p.id && pts===boardValues[o.id-1] && !o.done) { o.score -= m; if(o.score <= -3) { o.done=true; o.rank="Hävisi"; checkKillerEnd(); } } }); } break;
                    case 'scricket': case 'ccricket': if([20,19,18,17,16,15,25].includes(pts)) { let add = Math.min(m, 3-p.cricket[pts]); p.cricket[pts]+=add; let over = m-add; if(mode==='ccricket'&&over>0) players.forEach(o => { if(o.id!==p.id&&o.cricket[pts]<3) o.score+=(over*pts); }); } if([20,19,18,17,16,15,25].every(n => p.cricket[n]>=3)) { if(mode==='scricket') isWin=true; else if(p.score===Math.min(...players.map(pl=>pl.score))) isWin=true; } break;
                    case 'fives': p.turnT = (p.turnT || 0) + hitVal; break;
                    case 'encricket': if(p.role === 'bowler') { if(pts === 25) p.wickets = (p.wickets||0) + m; } else p.turnT = (p.turnT || 0) + hitVal; break;
                }
                if (isWin) { markWinner(p); return; }
                if (dartsLeftToThrow <= 0) finishTurn(p);
            }
            updateUI();
        }

        function handleWarfareAction(isH) {
            if (autoTimer) return;
            const p = players[curIdx]; dartsLeftToThrow--;
            if (isH) { p.score++; if(p.score >= 3) { markWinner(p); return; } }
            if (dartsLeftToThrow <= 0) startTimer();
            updateUI();
        }

        function finishTurn(p) {
            if(mode==='halveit' && !p.hitT) p.score = Math.floor(p.score / 2);
            if(mode==='fives') { let s = p.turnT || 0; if(s%5===0) p.score += (s/5); if(p.score>=goal) { markWinner(p); return; } }
            if(mode==='encricket' && p.role==='batter') { let s = p.turnT || 0; if(s>40) p.score += (s-40); }
            if (mode === 'prisoner') { if (players.reduce((sum, pl) => sum + pl.dartsInJail, 0) >= players.length * 3) { gameOverEveryoneLost(); return; } }
            let bow = players.find(pl => pl.role === 'bowler');
            if(mode==='encricket' && bow && bow.wickets >= 10) { swapCricket(); return; }
            startTimer();
        }

        function gameOverEveryoneLost() { showScreen('victory-screen'); document.getElementById('victory-title').innerText = "💀 KAIKKI HÄVISIVÄT!"; document.getElementById('results-list').innerHTML = "<p>Kaikki tikat jäivät vankilaan.</p>"; }

        function markWinner(p) {
            p.done = true; winners++; p.rank = winners;
            alert(`Sijoitus ${p.rank}: Pelaaja ${p.id}!`);
            if (players.filter(pl => !pl.done).length <= (mode==='killer'?1:0)) showResults();
            else nextPlayerManual();
        }

        function showResults() {
            if(mode === 'golf') {
                const minS = Math.min(...players.map(p => p.score));
                if(players.filter(p => p.score === minS).length > 1) {
                    alert("TASAPELI! Siirrytään jatkoväylille."); goal++; players.forEach(p => p.done = false); winners = 0; nextPlayerManual(); return;
                }
            }
            showScreen('victory-screen');
            document.getElementById('results-list').innerHTML = [...players].sort((a,b) => (mode==='golf'||mode==='ccricket'||mode==='warfare')?a.score-b.score:b.score-a.score).map((p, i) => `<p>${i+1}. Pelaaja ${p.id} (${p.score} pistettä)</p>`).join('');
        }

        function startTimer() {
            if (autoTimer) return;
            document.getElementById('timer-box').classList.remove('hidden');
            document.getElementById('dartboard-container').classList.add('disabled-board');
            let tL = 50;
            autoTimer = setInterval(() => {
                tL--; document.getElementById('timer-num').innerText = Math.ceil(tL / 10);
                document.getElementById('timer-bar-fill').style.width = (tL * 2) + "%";
                if (tL <= 0) nextPlayerManual();
            }, 100);
        }

        function nextPlayerManual() {
            clearInterval(autoTimer); autoTimer = null;
            document.getElementById('timer-box').classList.add('hidden');
            document.getElementById('dartboard-container').classList.remove('disabled-board');
            if(players.every(p => p.done)) return;
            let nI = (curIdx + 1) % players.length;
            while ((players[nI].done || (mode === 'prisoner' && players[nI].dartsAvailable <= 0)) && players.some(pl => !pl.done)) { nI = (nI + 1) % players.length; }
            if(nI <= curIdx) currentRound++;
            curIdx = nI; initTurn();
        }

        function initTurn() {
            const p = players[curIdx]; p.hitT = false; p.turnT = 0; p.shH = new Set();
            if (mode === 'prisoner' && p.dartsAvailable <= 0) { nextPlayerManual(); return; }
            dartsLeftToThrow = (mode === 'golf') ? 1 : Math.min(3, p.dartsAvailable);
            document.getElementById('turn-txt').innerText = `Pelaaja ${p.id} vuoro`;
            let hint = `KOHDE: ${goal}`;
            if(mode==='shanghai') hint = `SHANGHAI - Nro: ${currentRound}`;
            if(mode==='halveit') hint = `HALVE IT - Kohde: ${[20,19,'D',18,17,'T',16,15,25][currentRound-1]}`;
            if(mode==='golf') hint = `GOLF - Reikä: ${currentRound}`;
            if(mode==='clock') hint = `KELLON YMPÄRI - Nro: ${p.clock}`;
            if(mode==='killer') hint = `OSU NUMEROOSI: ${boardValues[p.id-1]}`;
            if(mode==='prisoner') hint = `VANKINVARTIJA - Kohde: ${p.clock}`;
            if(mode==='encricket') hint = p.role==='batter' ? "BATTER" : "BOWLER";
            document.getElementById('mode-hint').innerText = hint;
            document.getElementById('hit-txt').innerText = "Heitä tikka!";
            updateUI();
        }

        function updateUI() {
            const p = players[curIdx]; let dTxt = "";
            for(let i=0; i<3; i++) {
                if (i < (3 - dartsLeftToThrow)) dTxt += "○ ";
                else if (i < p.dartsAvailable) dTxt += "● ";
                else dTxt += "❌ ";
            }
            document.getElementById('darts-display').innerText = (mode === 'golf') ? "●" : dTxt;
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = players.map((p, i) => `
                <div class="player-box ${i===curIdx && !p.done?'active-p':''} ${p.done?'done-p':''} ${p.dartsAvailable <= 0 && mode==='prisoner'?'jail-p':''}">
                    <b>P${p.id}</b>${p.role?' ('+p.role[0].toUpperCase()+')':''}<br>
                    ${p.done ? p.rank+'.' : (['clock','prisoner'].includes(mode)?'Nro '+p.clock : (mode==='warfare' ? p.score+'/3' : p.score))}
                    ${mode==='prisoner'?'<br>T: '+p.dartsAvailable:''}
                </div>
            `).join('');
        }

        function swapCricket() { players.forEach(p => { p.role = (p.role === 'batter' ? 'bowler' : 'batter'); p.wickets = 0; p.turnT = 0; }); curIdx = players.findIndex(p => p.role === 'batter'); dartsLeftToThrow = 3; initTurn(); }

        (function initBoard() {
            const g = document.getElementById('board-g');
            for (let i = 0; i < 20; i++) {
                const a = (i * 18) - 99;
                const rad = Math.PI * a / 180, nRad = Math.PI * (a + 18) / 180;
                const draw = (r1, r2, c, m, type) => {
                    const x1 = 125+r1*Math.cos(rad), y1 = 125+r1*Math.sin(rad), x2 = 125+r1*Math.cos(nRad), y2 = 125+r1*Math.sin(nRad);
                    const x3 = 125+r2*Math.cos(nRad), y3 = 125+r2*Math.sin(nRad), x4 = 125+r2*Math.cos(rad), y4 = 125+r2*Math.sin(rad);
                    const d = `M ${x1} ${y1} A ${r1} ${r1} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${r2} ${r2} 0 0 0 ${x4} ${y4} Z`;
                    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    p.setAttribute("d", d); p.setAttribute("fill", c); p.setAttribute("class", "segment");
                    p.onclick = () => handleHit(boardValues[i], m, type); g.appendChild(p);
                };
                draw(22, 60, i%2?'#eee':'#111', 1, 'single-inner');
                draw(60, 85, i%2?'#27ae60':'#c0392b', 3, 'triple');
                draw(85, 105, i%2?'#eee':'#111', 1, 'single-outer');
                draw(105, 120, i%2?'#27ae60':'#c0392b', 2, 'double');
                const tx = 125+112*Math.cos(Math.PI*(a+9)/180), ty = 125+112*Math.sin(Math.PI*(a+9)/180)+4;
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", tx); t.setAttribute("y", ty); t.setAttribute("class", "board-text");
                t.setAttribute("text-anchor", "middle"); t.textContent = boardValues[i]; g.appendChild(t);
            }
            document.getElementById('bull-outer').onclick = () => handleHit(25, 1, 'single');
            document.getElementById('bull-inner').onclick = () => handleHit(25, 2, 'double');
        })();
    </script>
</body>
</html>
